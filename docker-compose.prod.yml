# =============================================================================
# URL Shortener - Production Environment
# =============================================================================
# NOTE: This compose file assumes external managed services for PostgreSQL
# and Redis. Update the URLs in your environment configuration.

services:
  # ---------------------------------------------------------------------------
  # API Service (Express + BullMQ Worker)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: url-shortener-api-prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SALT_ROUNDS: ${SALT_ROUNDS:-12}
      IP_HASH_SALT: ${IP_HASH_SALT}
      APP_BASE_URL: ${APP_BASE_URL}
      API_PORT: ${API_PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-./data/GeoLite2-City.mmdb}
      BULL_CONCURRENCY: ${BULL_CONCURRENCY:-5}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_LINKS: ${RATE_LIMIT_MAX_LINKS:-10}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - url-shortener-network

# =============================================================================
# Networks
# =============================================================================
networks:
  url-shortener-network:
    driver: bridge
